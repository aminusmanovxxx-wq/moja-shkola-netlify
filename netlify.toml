[build]
  publish = "public"
  functions = "netlify/functions"
  command = "cat source-part-*.b64 | base64 -d > /tmp/moja-shkola.tar.gz && rm -rf /tmp/moja-shkola && mkdir -p /tmp/moja-shkola && tar -xzf /tmp/moja-shkola.tar.gz -C /tmp/moja-shkola && cp -a /tmp/moja-shkola/moja-shkola-netlify/. . && npm test && npm run typecheck"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=()"
