name: Validate project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run typecheck
      - name: Package complete project ZIP
        if: github.event_name != 'pull_request'
        run: zip -qr moja-shkola-plus.zip . -x ".git/*" "node_modules/*" ".netlify/*" "moja-shkola-plus.zip"
      - name: Upload complete project ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: moja-shkola-plus-project
          path: moja-shkola-plus.zip
          if-no-files-found: error
          retention-days: 30
