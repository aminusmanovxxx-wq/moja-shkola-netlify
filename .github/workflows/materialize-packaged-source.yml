name: Materialize packaged project source

on:
  push:
    branches: [main]
    paths:
      - source-upload-complete

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f source-upload-complete
          shopt -s nullglob
          parts=(source-part-*.b64)
          test "${#parts[@]}" -eq 15
          cat "${parts[@]}" | tr -d '\n\r ' | base64 --decode > /tmp/project-archive.gz
          mkdir -p /tmp/project-unpack
          if tar -tzf /tmp/project-archive.gz >/dev/null 2>&1; then
            tar -xzf /tmp/project-archive.gz -C /tmp/project-unpack
          else
            gzip -dc /tmp/project-archive.gz > /tmp/project-archive.bin
            if unzip -tq /tmp/project-archive.bin >/dev/null 2>&1; then
              unzip -q /tmp/project-archive.bin -d /tmp/project-unpack
            else
              echo "Archive is neither a gzip-compressed tar nor a gzip-compressed ZIP." >&2
              exit 1
            fi
          fi
          source_root="$(find /tmp/project-unpack -type f -name netlify.toml -not -path '*/node_modules/*' -print -quit | xargs -r dirname)"
          test -n "$source_root"
          cp -a "$source_root"/. .
          rm -f source-part-*.b64 source-upload-complete source-bundle.b64
          git add -A
          if git diff --cached --quiet; then
            echo "Project files were already materialized."
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+actions@users.noreply.github.com' commit -m 'Materialize complete Moja Shkola source'
            git push
          fi
