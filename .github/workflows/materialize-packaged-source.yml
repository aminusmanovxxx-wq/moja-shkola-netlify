name: Materialize packaged project source

on:
  push:
    branches: [main]
    paths:
      - source-upload-complete
      - source-upload-retry

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f source-upload-complete
          shopt -s nullglob
          parts=(source-part-*.b64)
          test "${#parts[@]}" -ge 10
          cat "${parts[@]}" | tr -d '\n\r ' | base64 --decode > /tmp/project-archive.gz
          mkdir -p /tmp/project-unpack
          # Some transfer paths preserve a usable TAR/ZIP payload but alter the
          # gzip trailer; inspect the decoded payload before rejecting the files.
          set +e
          gzip -dc /tmp/project-archive.gz > /tmp/project-archive.bin
          gzip_status=$?
          set -e
          if tar -tf /tmp/project-archive.bin >/dev/null 2>&1; then
            tar -xf /tmp/project-archive.bin -C /tmp/project-unpack
          elif unzip -tq /tmp/project-archive.bin >/dev/null 2>&1; then
            unzip -q /tmp/project-archive.bin -d /tmp/project-unpack
          else
            echo "Gzip decompression status: $gzip_status" >&2
            echo "Decoded content is not a valid TAR or ZIP archive." >&2
            exit 1
          fi
          source_root="$(find /tmp/project-unpack -type f -name netlify.toml -not -path '*/node_modules/*' -print -quit | xargs -r dirname)"
          test -n "$source_root"
          cp -a "$source_root"/. .
          rm -f source-part-*.b64 source-upload-complete source-upload-retry source-bundle.b64
          git add -A
          if git diff --cached --quiet; then
            echo "Project files were already materialized."
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+actions@users.noreply.github.com' commit -m 'Materialize complete Moja Shkola source'
            git push
          fi
